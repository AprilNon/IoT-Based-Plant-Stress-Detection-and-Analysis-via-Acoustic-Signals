<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg:         #f0f4f8;
  --surface:    #ffffff;
  --surface2:   #f7fafc;
  --border:     #e2e8f0;
  --text:       #1a202c;
  --text-md:    #4a5568;
  --text-sm:    #718096;
  --orange:     #ed8936;
  --orange-lt:  #fff3e0;
  --blue:       #3182ce;
  --blue-lt:    #ebf8ff;
  --green:      #38a169;
  --green-lt:   #f0fff4;
  --purple:     #6b46c1;
  --purple-lt:  #faf5ff;
  --red:        #e53e3e;
  --red-lt:     #fff5f5;
  --mono:       'IBM Plex Mono', monospace;
  --sans:       'Sarabun', sans-serif;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow:     0 4px 16px rgba(0,0,0,.08);
  --r:          16px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); font-family: var(--sans); font-size: 15px; color: var(--text); min-height: 100vh; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.app { max-width: 1280px; margin: 0 auto; padding: 0 24px 40px; }

/* ── Header ─────────────────────────────────────────────── */
header { display:flex; align-items:center; justify-content:space-between; padding:18px 0 20px; border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap; gap:12px; }
.logo { display:flex; align-items:center; gap:12px; }
.logo-icon { width:44px; height:44px; background:#22c55e; border-radius:12px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(34,197,94,.35); }
.logo-text h1 { font-size:1.35rem; font-weight:700; color:var(--text); line-height:1.1; }
.logo-text p  { font-size:.78rem; color:var(--text-sm); }
.header-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

/* ── Sheet Selector ─────────────────────────────────────── */
.sheet-selector-wrap {
  display:flex; align-items:center; gap:6px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:99px; padding:5px 10px 5px 12px;
  color:var(--text-sm); font-size:.78rem;
  transition:border-color .2s;
}
.sheet-selector-wrap:focus-within { border-color:var(--blue); }
.sheet-select {
  border:none; background:transparent; font-size:.78rem; font-family:var(--mono);
  color:var(--text); cursor:pointer; outline:none; max-width:130px;
}
.btn-new-sheet {
  width:24px; height:24px; border-radius:50%; border:1.5px solid var(--border);
  background:var(--bg); color:var(--text-md); display:flex; align-items:center;
  justify-content:center; cursor:pointer; transition:all .2s; flex-shrink:0;
}
.btn-new-sheet:hover { border-color:var(--green); color:var(--green); background:var(--green-lt); }

/* ── Record Button ──────────────────────────────────────── */
.btn-record {
  display:flex; align-items:center; gap:6px; padding:7px 14px;
  border-radius:99px; border:none; cursor:pointer;
  font-size:.8rem; font-weight:600; font-family:var(--sans);
  background:#e53e3e; color:#fff;
  box-shadow:0 2px 8px rgba(229,62,62,.35);
  transition:all .2s;
}
.btn-record:hover { background:#c53030; box-shadow:0 2px 12px rgba(229,62,62,.5); }
.btn-record:active { transform:scale(.95); }
.btn-record.recording {
  background:#c53030;
  animation:rec-pulse 1s infinite;
}
@keyframes rec-pulse {
  0%,100% { box-shadow:0 0 0 0 rgba(229,62,62,.55); }
  50%     { box-shadow:0 0 0 8px rgba(229,62,62,0); }
}
.btn-record:disabled { background:var(--border); color:var(--text-sm); box-shadow:none; cursor:not-allowed; animation:none; }

/* ── Toast (record feedback) ────────────────────────────── */
.record-toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  padding:10px 20px; border-radius:99px; font-size:.82rem; font-weight:600;
  font-family:var(--mono); z-index:9999; pointer-events:none;
  white-space:nowrap; box-shadow:0 4px 20px rgba(0,0,0,.18);
  transition:opacity .3s;
}
.record-toast.ok  { background:#22c55e; color:#fff; }
.record-toast.err { background:var(--red); color:#fff; }

/* ── Sheet badge in chart title ─────────────────────────── */
.sheet-badge {
  display:inline-block; font-size:.65rem; font-family:var(--mono);
  background:var(--blue-lt); color:var(--blue);
  border:1px solid #bee3f8; border-radius:99px;
  padding:2px 8px; margin-left:6px; vertical-align:middle;
}

/* ── Buttons ────────────────────────────────────────────── */
.btn-reload { width:36px; height:36px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface); color:var(--text-md); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; }
.btn-reload:hover  { border-color:var(--blue); color:var(--blue); background:var(--blue-lt); }
.btn-reload:active { transform:scale(.9); }
.btn-reload.spinning svg { animation:spin .65s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.conn-badge { display:flex; align-items:center; gap:7px; padding:7px 16px; border-radius:99px; font-size:.8rem; font-weight:600; border:none; cursor:default; user-select:none; transition:all .3s; font-family:var(--sans); }
.conn-badge.connected    { background:#22c55e; color:#fff; box-shadow:0 2px 10px rgba(34,197,94,.4); }
.conn-badge.disconnected { background:#fc8181; color:#fff; box-shadow:0 2px 10px rgba(252,129,129,.4); }
.conn-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.8); animation:blink 1.4s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

#last-ts { font-family:var(--mono); font-size:.7rem; color:var(--text-sm); text-align:right; margin-bottom:16px; }

/* ── Cards ──────────────────────────────────────────────── */
.cards-top { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
@media (max-width:900px) { .cards-top { grid-template-columns:1fr 1fr; } }
@media (max-width:520px) { .cards-top { grid-template-columns:1fr; } }

.card { background:var(--surface); border-radius:var(--r); padding:20px; box-shadow:var(--shadow-sm); border:1px solid var(--border); position:relative; overflow:hidden; transition:box-shadow .2s,transform .2s; }
.card:hover { box-shadow:var(--shadow); transform:translateY(-1px); }
.card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; border-radius:0 0 var(--r) var(--r); }
.card-orange::after { background:var(--orange); }
.card-blue::after   { background:var(--blue); }
.card-green::after  { background:var(--green); }
.card-purple::after { background:var(--purple); }

.card-label { display:flex; align-items:center; gap:8px; font-size:.8rem; font-weight:600; margin-bottom:10px; }
.card-orange .card-label { color:var(--orange); }
.card-blue   .card-label { color:var(--blue); }
.card-green  .card-label { color:var(--green); }
.card-purple .card-label { color:var(--purple); }

.card-value { font-family:var(--mono); font-size:2.6rem; font-weight:600; color:var(--text); line-height:1; letter-spacing:-1px; }
.card-value .unit { font-size:1.3rem; font-weight:500; vertical-align:middle; margin-left:2px; }
.card-sub { font-size:.75rem; color:var(--text-sm); margin-top:8px; min-height:1.1em; }

.status-big { font-family:var(--mono); font-size:2.2rem; font-weight:700; line-height:1; margin-top:12px; letter-spacing:2px; transition:color .3s; display:flex; align-items:center; gap:10px; }
.status-big::before { content:''; display:inline-block; width:12px; height:12px; border-radius:50%; flex-shrink:0; transition:background .3s,box-shadow .3s; }
.status-big.s-green  { color:var(--green); }
.status-big.s-green::before  { background:var(--green); box-shadow:0 0 8px rgba(56,161,105,.6); animation:pulse-g 1.6s infinite; }
.status-big.s-red    { color:var(--red); }
.status-big.s-red::before    { background:var(--red); box-shadow:0 0 8px rgba(229,62,62,.5); }
.status-big.s-orange { color:var(--orange); }
.status-big.s-orange::before { background:var(--orange); box-shadow:0 0 6px rgba(237,137,54,.5); }
@keyframes pulse-g { 0%,100%{box-shadow:0 0 8px rgba(56,161,105,.6)} 50%{box-shadow:0 0 14px rgba(56,161,105,.9)} }
.status-sub { font-size:.78rem; color:var(--text-sm); margin-top:10px; font-family:var(--mono); letter-spacing:.3px; }

/* ── Layout bottom ──────────────────────────────────────── */
.cards-bot { display:grid; grid-template-columns:1fr 360px; gap:16px; align-items:start; }
@media (max-width:900px) { .cards-bot { grid-template-columns:1fr; } }

.wav-card { background:var(--surface); border-radius:var(--r); padding:20px; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
.wav-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.wav-title  { font-size:.95rem; font-weight:700; color:var(--text); display:flex; align-items:center; gap:6px; }

.wav-placeholder-block { height:260px; background:#0f172a; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:#4a5568; font-size:.8rem; font-family:var(--mono); }
.wav-placeholder-block .ph-icon { opacity:.4; }
.wav-placeholder-block p { opacity:.5; letter-spacing:1px; }

.wav-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
.wav-stat { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 12px; text-align:center; }
.wav-stat .sv { font-family:var(--mono); font-size:.95rem; font-weight:600; color:var(--text); }
.wav-stat .sl { font-size:.65rem; color:var(--text-sm); margin-top:3px; letter-spacing:.5px; text-transform:uppercase; }
.wav-stat.empty .sv { color:#a0aec0; }

/* ── Info card ──────────────────────────────────────────── */
.info-card { background:var(--surface); border-radius:var(--r); padding:20px; box-shadow:var(--shadow-sm); border:1px solid var(--border); display:flex; flex-direction:column; gap:16px; }
.info-section-title { font-size:.72rem; font-weight:700; color:var(--text-sm); letter-spacing:1px; text-transform:uppercase; margin-bottom:7px; display:flex; align-items:center; }
.file-box { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-family:var(--mono); font-size:.73rem; color:var(--blue); word-break:break-all; min-height:36px; display:flex; align-items:center; gap:8px; }

.hist-table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:.73rem; }
thead th { text-align:left; padding:5px 7px; color:var(--text-sm); font-weight:600; letter-spacing:.4px; border-bottom:1px solid var(--border); white-space:nowrap; }
tbody td { padding:6px 7px; border-bottom:1px solid var(--bg); white-space:nowrap; font-family:var(--mono); font-size:.7rem; color:var(--text); }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover td { background:var(--bg); }
.td-green  { color:var(--green)  !important; }
.td-orange { color:var(--orange) !important; }
.td-red    { color:var(--red)    !important; }
.td-blue   { color:var(--blue)   !important; }

/* ── Upload / AI ────────────────────────────────────────── */
.upload-zone { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px; border:1.5px dashed var(--border); background:var(--bg); cursor:pointer; transition:all .2s; font-size:.78rem; color:var(--text-sm); font-family:var(--mono); }
.upload-zone:hover    { border-color:var(--blue); background:var(--blue-lt); color:var(--blue); }
.upload-zone.has-file { border-color:var(--green); background:var(--green-lt); color:var(--green); border-style:solid; }

#wav-player { width: 100%; border-radius: 8px; outline: none; accent-color: var(--blue); }

.ai-analyze-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:9px; font-size:.85rem; font-weight:600; border:none; cursor:pointer; font-family:var(--sans); transition:all .2s; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; }
.ai-analyze-btn:hover:not(:disabled)  { opacity:.88; transform:translateY(-1px); }
.ai-analyze-btn:active:not(:disabled) { transform:scale(.98); }
.ai-analyze-btn:disabled { background:var(--border); color:var(--text-sm); cursor:not-allowed; }
.ai-analyze-btn.loading  { opacity:.7; cursor:wait; }

.ai-result { background:var(--bg); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.ai-result-row { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); }
.ai-result-label { font-size:.72rem; color:var(--text-sm); font-family:var(--mono); letter-spacing:.5px; text-transform:uppercase; }
.ai-result-val   { font-size:1.05rem; font-weight:700; color:var(--text); font-family:var(--mono); }

.ai-error { padding:9px 12px; border-radius:8px; background:var(--red-lt); border:1px solid #fca5a5; font-size:.75rem; color:var(--red); font-family:var(--mono); }

.hf-link-btn { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; text-decoration:none; background:var(--bg); border:1px solid var(--border); transition:all .2s; }
.hf-link-btn:hover { border-color:var(--blue); background:var(--blue-lt); }
.hf-link-icon { width:34px; height:34px; border-radius:8px; flex-shrink:0; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; color:#fff; }
.hf-link-text { flex:1; display:flex; flex-direction:column; gap:2px; }
.hf-link-title { font-size:.8rem; font-weight:600; color:var(--text); line-height:1.2; }
.hf-link-sub   { font-size:.67rem; color:var(--text-sm); font-family:var(--mono); }

.ctrl-lbl { font-size:.72rem; color:var(--text-sm); font-family:var(--mono); white-space:nowrap; }
.date-pick { padding:3px 9px; border-radius:6px; font-size:.75rem; border:0.5px solid var(--border); background:var(--surface2); color:var(--text); font-family:var(--mono); cursor:pointer; outline:none; transition:border-color .15s; }
.date-pick:hover,.date-pick:focus { border-color:var(--blue); }
.range-btn { padding:3px 10px; border-radius:6px; font-size:.75rem; font-weight:600; border:0.5px solid var(--border); background:var(--surface2); color:var(--text-sm); cursor:pointer; font-family:var(--mono); transition:all .15s; }
.range-btn:hover { border-color:var(--blue); color:var(--blue); }
.active-btn { background:var(--surface); color:var(--text); border-color:var(--text-md); }

/* ── Modal ──────────────────────────────────────────────── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(2px);
}
.modal-box {
  background:var(--surface); border-radius:var(--r); padding:28px;
  width:min(420px,92vw); box-shadow:0 20px 60px rgba(0,0,0,.2);
  border:1px solid var(--border);
  animation:modal-in .18s ease;
}
@keyframes modal-in { from{opacity:0;transform:scale(.94)} to{opacity:1;transform:scale(1)} }
.modal-header { display:flex; align-items:center; gap:8px; font-size:1rem; font-weight:700; color:var(--text); margin-bottom:18px; }
.modal-body   { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
.modal-label  { font-size:.75rem; font-weight:600; color:var(--text-sm); letter-spacing:.5px; text-transform:uppercase; }
.modal-input  {
  width:100%; padding:10px 14px; border-radius:8px;
  border:1.5px solid var(--border); background:var(--bg);
  font-size:.9rem; font-family:var(--mono); color:var(--text);
  outline:none; transition:border-color .15s;
}
.modal-input:focus { border-color:var(--blue); }
.modal-error  { font-size:.75rem; color:var(--red); font-family:var(--mono); padding:6px 10px; background:var(--red-lt); border-radius:6px; border:1px solid #fca5a5; }
.modal-footer { display:flex; justify-content:flex-end; gap:8px; }
.modal-btn-cancel {
  padding:9px 20px; border-radius:8px; border:1.5px solid var(--border);
  background:transparent; color:var(--text-md); font-size:.85rem; font-weight:600;
  cursor:pointer; font-family:var(--sans); transition:all .15s;
}
.modal-btn-cancel:hover { background:var(--bg); }
.modal-btn-ok {
  display:flex; align-items:center; gap:6px;
  padding:9px 20px; border-radius:8px; border:none;
  background:var(--green); color:#fff; font-size:.85rem; font-weight:600;
  cursor:pointer; font-family:var(--sans); transition:all .15s;
  box-shadow:0 2px 8px rgba(56,161,105,.3);
}
.modal-btn-ok:hover { background:#2f855a; }
.modal-btn-ok:disabled { background:var(--border); color:var(--text-sm); box-shadow:none; cursor:not-allowed; }

/* ── Day Availability Chips ─────────────────────────────── */
.day-chip {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:5px 8px; border-radius:8px; border:1.5px solid var(--border);
  background:var(--surface); cursor:pointer;
  transition:all .15s; font-family:var(--mono); min-width:46px;
}
.day-chip:hover { border-color:var(--blue); background:var(--blue-lt); }
.day-chip-active { border-color:var(--blue); background:var(--blue-lt); }
.day-chip-today  { border-color:var(--green); }
.day-chip-today.day-chip-active { border-color:var(--blue); }
.chip-date { font-size:.72rem; font-weight:600; color:var(--text); line-height:1; }
.chip-cnt  { font-size:.62rem; color:var(--text-sm); }
.day-chip-active .chip-date { color:var(--blue); }
.day-chip:hover .chip-date  { color:var(--blue); }

</style>
